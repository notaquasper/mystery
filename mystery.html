<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cold Case Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#1a1512;--paper:#d8c9a3;--paper-dark:#a89670;--gold:#c9a961;--blood:#8a2424;--smoke:#3a3530;--bg:#0d0a08}
html,body{height:100%;overflow:hidden;font-family:'Courier Prime',monospace;background:var(--bg);color:var(--paper);user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}

.grain{position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.09;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");animation:grain .5s steps(3) infinite;mix-blend-mode:overlay}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-4%,3%)}66%{transform:translate(3%,-4%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:998;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.85) 100%)}
.rain{position:fixed;inset:-50%;pointer-events:none;z-index:1;opacity:.13;background-image:repeating-linear-gradient(105deg,transparent 0,transparent 2px,rgba(200,200,200,.6) 2px,rgba(200,200,200,.6) 3px,transparent 3px,transparent 7px);background-size:6px 14px;animation:rain .4s linear infinite;mix-blend-mode:screen}
@keyframes rain{from{transform:translateY(0)}to{transform:translateY(14px)}}

.app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:linear-gradient(180deg,#14100c 0%,#0d0a08 100%);overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .45s ease}
.screen.active{opacity:1;pointer-events:auto}

/* ---------- INTRO ---------- */
#intro{padding:30px 22px;justify-content:center;align-items:center;text-align:center;overflow-y:auto}
.case-stamp{font-family:'Special Elite',monospace;font-size:12px;letter-spacing:5px;color:var(--blood);border:2px solid var(--blood);padding:5px 12px;margin-bottom:18px;transform:rotate(-3deg);background:rgba(138,36,36,.1)}
.club-name{font-family:'Special Elite',monospace;font-size:26px;line-height:1.15;letter-spacing:2px;color:var(--paper);text-shadow:2px 2px 0 rgba(0,0,0,.8);margin-bottom:6px}
.victim-line{font-size:13px;letter-spacing:3px;color:var(--paper-dark);margin-bottom:24px}
.typewriter{font-size:14.5px;line-height:1.75;text-align:left;min-height:160px;max-width:420px;color:var(--paper);border-left:2px solid var(--gold);padding-left:14px;margin-bottom:22px;white-space:pre-wrap}
.typewriter::after{content:'▌';animation:blink .7s step-end infinite;color:var(--gold)}
.typewriter.done::after{display:none}
@keyframes blink{50%{opacity:0}}

.btn{font-family:'Special Elite',monospace;font-size:14px;letter-spacing:3px;padding:14px 26px;background:transparent;color:var(--gold);border:2px solid var(--gold);cursor:pointer;transition:all .2s;text-transform:uppercase;touch-action:manipulation}
.btn:active{background:var(--gold);color:var(--ink);box-shadow:0 0 30px rgba(201,169,97,.6)}

/* ---------- HUB ---------- */
.hub-header{padding:12px 16px;border-bottom:1px solid rgba(201,169,97,.25);display:flex;justify-content:space-between;align-items:center;background:rgba(20,16,12,.9);flex-shrink:0}
.hub-header .ct{font-family:'Special Elite',monospace;font-size:11px;letter-spacing:3px;color:var(--gold)}
.hub-header .prog{font-size:11px;color:var(--paper-dark);letter-spacing:1px}
.hub-header .prog span{color:var(--gold);font-weight:bold}
.hub-main{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.section-intro{font-family:'Special Elite',monospace;font-size:12px;letter-spacing:2px;color:var(--paper-dark);margin-bottom:12px;padding-bottom:8px;border-bottom:1px dashed rgba(216,201,163,.3)}
.card{background:linear-gradient(135deg,rgba(40,32,24,.9),rgba(25,20,15,.9));border:1px solid rgba(201,169,97,.35);border-left:3px solid var(--gold);padding:13px;margin-bottom:10px;cursor:pointer;transition:all .15s;position:relative}
.card:active{transform:scale(.98)}
.card .name{font-family:'Special Elite',monospace;font-size:15px;color:var(--paper);margin-bottom:3px;letter-spacing:1px}
.card .sub{font-size:11.5px;color:var(--paper-dark);font-style:italic}
.card .count{position:absolute;top:13px;right:13px;font-size:10.5px;color:var(--gold);letter-spacing:1px}
.card.done{border-left-color:var(--smoke);opacity:.75}
.card.done .count{color:var(--paper-dark)}
.suspect-card{display:flex;gap:12px;align-items:center}
.suspect-avatar{font-size:38px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(201,169,97,.4);background:rgba(0,0,0,.4);flex-shrink:0}
.suspect-info{flex:1}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(201,169,97,.3);background:rgba(20,16,12,.95);flex-shrink:0}
.tab{font-family:'Special Elite',monospace;font-size:9.5px;letter-spacing:1px;padding:10px 4px;background:transparent;border:none;color:var(--paper-dark);cursor:pointer;text-transform:uppercase;transition:all .2s;position:relative}
.tab.active{color:var(--gold);background:rgba(201,169,97,.08)}
.tab.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.tab .tab-icon{display:block;font-size:15px;margin-bottom:2px;font-family:system-ui,sans-serif}

.detail-screen{background:linear-gradient(180deg,#14100c,#0a0806);z-index:100;padding:0}
.detail-header{padding:12px 14px;border-bottom:1px solid rgba(201,169,97,.3);display:flex;align-items:center;gap:10px;background:rgba(20,16,12,.95);flex-shrink:0}
.back-btn{font-family:'Special Elite',monospace;font-size:11px;letter-spacing:2px;padding:8px 12px;background:transparent;border:1px solid rgba(201,169,97,.4);color:var(--gold);cursor:pointer}
.back-btn:active{background:rgba(201,169,97,.15)}
.detail-title{font-family:'Special Elite',monospace;font-size:14px;color:var(--paper);letter-spacing:1px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.detail-desc{font-size:13.5px;line-height:1.7;color:var(--paper);font-style:italic;margin-bottom:16px;padding:12px;background:rgba(0,0,0,.3);border-left:3px solid var(--gold)}

.hotspot{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:7px;background:rgba(40,32,24,.6);border:1px solid rgba(201,169,97,.25);cursor:pointer;transition:all .15s;font-size:13.5px;color:var(--paper);text-align:left;width:100%;font-family:'Courier Prime',monospace}
.hotspot:active{transform:scale(.98)}
.hotspot.found{border-color:var(--smoke);color:var(--paper-dark)}
.hotspot .icon{font-family:system-ui,sans-serif;font-size:17px;width:24px;text-align:center;flex-shrink:0}
.hotspot .label{flex:1}
.hotspot .status{font-size:9.5px;letter-spacing:1px;color:var(--gold);flex-shrink:0}
.hotspot.found .status{color:var(--smoke)}

.found-text{padding:13px;background:rgba(138,36,36,.15);border-left:3px solid var(--blood);font-size:13.5px;line-height:1.7;color:var(--paper);margin:12px 0 16px;animation:reveal .4s ease}
.found-text.flavor{background:rgba(0,0,0,.3);border-left-color:var(--smoke);color:var(--paper-dark);font-style:italic}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.found-text .tag{font-family:'Special Elite',monospace;font-size:10.5px;letter-spacing:2px;color:var(--gold);display:block;margin-bottom:6px}

.suspect-header{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(201,169,97,.25)}
.suspect-header .avatar{font-size:52px;width:72px;height:72px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(201,169,97,.5);background:rgba(0,0,0,.5);flex-shrink:0}
.suspect-header .info h2{font-family:'Special Elite',monospace;font-size:17px;color:var(--paper);letter-spacing:1px;margin-bottom:3px}
.suspect-header .info .role{font-size:11px;color:var(--gold);letter-spacing:2px;text-transform:uppercase}
.suspect-header .info .desc{font-size:11.5px;font-style:italic;color:var(--paper-dark);margin-top:5px;line-height:1.5}

.q-btn{display:block;width:100%;text-align:left;padding:11px 13px;margin-bottom:7px;background:rgba(40,32,24,.5);border:1px solid rgba(201,169,97,.25);color:var(--paper);font-family:'Courier Prime',monospace;font-size:13px;line-height:1.4;cursor:pointer;transition:all .15s;border-left:3px solid var(--gold)}
.q-btn:active{transform:scale(.98)}
.q-btn.asked{opacity:.55;border-left-color:var(--smoke)}
.q-btn.new{border-left-color:var(--blood);box-shadow:0 0 12px rgba(138,36,36,.35)}

.response{padding:13px;background:rgba(0,0,0,.4);border-left:3px solid var(--blood);margin-bottom:12px;font-size:13.5px;line-height:1.7;font-style:italic;color:var(--paper);animation:reveal .4s ease}
.response::before{content:'❝';color:var(--blood);font-size:20px;margin-right:5px;font-family:Georgia,serif}
.response::after{content:'❞';color:var(--blood);font-size:20px;margin-left:5px;font-family:Georgia,serif}

.evidence-item{padding:11px 13px;margin-bottom:9px;background:rgba(40,32,24,.5);border:1px solid rgba(201,169,97,.3);border-left:3px solid var(--gold)}
.evidence-item .ev-name{font-family:'Special Elite',monospace;font-size:13px;color:var(--gold);letter-spacing:1px;margin-bottom:3px}
.evidence-item .ev-text{font-size:12.5px;color:var(--paper);line-height:1.55}

.empty-state{text-align:center;padding:36px 20px;color:var(--paper-dark);font-style:italic;font-size:13.5px;line-height:1.7}
.empty-state .big{font-size:40px;margin-bottom:12px;font-family:system-ui,sans-serif;opacity:.5}

.accuse-warning{padding:13px;background:rgba(138,36,36,.2);border:1px solid var(--blood);color:var(--paper);font-size:12.5px;line-height:1.6;margin-bottom:16px;text-align:center;font-family:'Special Elite',monospace;letter-spacing:1px}
.accuse-btn{display:block;width:100%;padding:16px;margin-bottom:10px;background:rgba(40,32,24,.6);border:2px solid rgba(201,169,97,.4);color:var(--paper);font-family:'Special Elite',monospace;font-size:14px;letter-spacing:2px;cursor:pointer;text-align:center;transition:all .2s}
.accuse-btn:active{transform:scale(.98);background:rgba(138,36,36,.4);box-shadow:0 0 30px rgba(138,36,36,.5)}

#ending{padding:30px 22px;justify-content:center;align-items:center;text-align:center;background:radial-gradient(ellipse at center,#1a1512 0%,#050302 100%);overflow-y:auto}
.ending-title{font-family:'Special Elite',monospace;font-size:28px;letter-spacing:4px;margin-bottom:18px}
.ending-title.win{color:var(--gold);text-shadow:0 0 30px rgba(201,169,97,.6)}
.ending-title.lose{color:var(--blood);text-shadow:0 0 30px rgba(138,36,36,.6)}
.ending-text{font-size:14px;line-height:1.8;color:var(--paper);max-width:420px;margin-bottom:24px;font-style:italic;white-space:pre-wrap}
.ending-stats{font-family:'Special Elite',monospace;font-size:12px;letter-spacing:1.5px;color:var(--paper-dark);margin-bottom:24px;padding:12px 18px;border-top:1px solid rgba(201,169,97,.3);border-bottom:1px solid rgba(201,169,97,.3);line-height:1.8}
.ending-stats span{color:var(--gold)}
.ending-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px}

.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-100px);padding:9px 20px;background:var(--gold);color:var(--ink);font-family:'Special Elite',monospace;font-size:11px;letter-spacing:2px;z-index:9000;transition:transform .4s cubic-bezier(.2,1.2,.4,1);pointer-events:none;box-shadow:0 8px 30px rgba(201,169,97,.6)}
.toast.show{transform:translate(-50%,0)}

.detail-body::-webkit-scrollbar,.hub-main::-webkit-scrollbar{width:4px}
.detail-body::-webkit-scrollbar-thumb,.hub-main::-webkit-scrollbar-thumb{background:rgba(201,169,97,.3)}
#intro::-webkit-scrollbar,#ending::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<div class="rain"></div>
<div class="grain"></div>
<div class="vignette"></div>

<div class="app">
  <section id="intro" class="screen active">
    <div class="case-stamp" id="caseStamp">CASE FILE</div>
    <h1 class="club-name" id="clubName"></h1>
    <div class="victim-line" id="victimLine"></div>
    <div class="typewriter" id="introText"></div>
    <button class="btn" id="beginBtn" style="opacity:0;pointer-events:none">BEGIN INVESTIGATION</button>
  </section>

  <section id="hub" class="screen">
    <header class="hub-header">
      <div class="ct" id="hubCaseId">CASE</div>
      <div class="prog">EVIDENCE <span id="evCount">0</span>/<span id="evTotal">0</span></div>
    </header>
    <div class="hub-main" id="hubMain"></div>
    <nav class="tabs">
      <button class="tab active" data-tab="locations"><span class="tab-icon">📍</span>Locations</button>
      <button class="tab" data-tab="suspects"><span class="tab-icon">🕵️</span>Suspects</button>
      <button class="tab" data-tab="evidence"><span class="tab-icon">📁</span>Evidence</button>
      <button class="tab" data-tab="accuse"><span class="tab-icon">⚖️</span>Accuse</button>
    </nav>
  </section>

  <section id="detail" class="screen detail-screen">
    <header class="detail-header">
      <button class="back-btn" id="backBtn">◄ BACK</button>
      <div class="detail-title" id="detailTitle"></div>
    </header>
    <div class="detail-body" id="detailBody"></div>
  </section>

  <section id="ending" class="screen">
    <h1 class="ending-title" id="endingTitle"></h1>
    <div class="ending-text" id="endingText"></div>
    <div class="ending-stats" id="endingStats"></div>
    <div class="ending-actions">
      <button class="btn" id="newCaseBtn">NEW CASE</button>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   DATA POOLS
============================================================ */
const DATA = {
  firstNames: ['Vivian','Marcus','Rita','Johnny','Evelyn','Frank','Dolores','Sam','Mabel','Vincent','Gloria','Leo','Stella','Hugo','Iris','Otto','Vera','Bruno','Nora','Clyde','Hazel','Miles','Bette','Rex','Ada','Karl','Ruth','Saul','Pearl','Eddie','Cora','Wade','Ivy','Dean','Ruby','Walt','Lila','Art','Nina','Bud'],
  lastNames: ['Cross','Kane','Vane','Malone','Sterling','Marchetti','Blackwood','Rosetti','Lancaster','Delgado','Voss','Sinclair','Whitmore','Castellano','Hollis','Brennan','Knox','Moreau','Lombardi','Carver','Ashford','Gallo','Vance','Rourke','Beaumont','Fitzgerald','Lang','Carrow','Pike','Severin'],
  victimRoles: ['jazz singer','cabaret dancer','torch singer','club pianist','headline act','songwriter','bandleader','fortune teller'],
  clubNames: ['The Black Dahlia','The Velvet Room','The Blue Orchid','The Red Door','The Silver Slipper','The Pink Flamingo','The Midnight Lounge','The Copper Club','The Gilded Cage','The Velvet Underground','The Smoke Room','The Juniper','The Blue Note','The Rusty Anchor','The Black Cat','The Palm Reader','The Casablanca','The Diamond Horseshoe','The Follies','The Starlight'],
  suspectTemplates: [
    {role:'Club Owner',avatar:'🎩',motive:'money',
      qWhere:'"In my office. Working the books. Ask anyone — you won\'t find anyone who says different."',
      qRelation:'"She was my star. My investment. This club was built on her voice."',
      qMotive:'"Careful, detective. I pay my taxes. I don\'t answer questions like that."'},
    {role:'Rival Performer',avatar:'🎤',motive:'jealousy',
      qWhere:'"On stage, darling. Three songs straight. The whole room was watching me for once."',
      qRelation:'"We shared a dressing room. Shared a stage. Never shared a spotlight."',
      qMotive:'"I wanted her part. Not her funeral. There\'s a difference."'},
    {role:'Estranged Husband',avatar:'💍',motive:'obsession',
      qWhere:'"Home. Alone. That\'s the story and it\'s true. You can check with my doorman."',
      qRelation:'"She was my wife. That doesn\'t stop meaning something just because she walks away."',
      qMotive:'"I loved her. You don\'t kill what you love. You just — you just wait."'},
    {role:'Business Partner',avatar:'💼',motive:'money',
      qWhere:'"A meeting. Uptown. Big client. I have receipts and three witnesses."',
      qRelation:'"We were in business. That\'s all. Business that was going very well."',
      qMotive:'"I have no motive, detective. Everything was fine. Better than fine."'},
    {role:'Gambler',avatar:'🎲',motive:'money',
      qWhere:'"Not here. Took a cab home. Eleven sharp. Check the doorman — he saw me leave."',
      qRelation:'"She owed me money. Old debt. I came to collect. Didn\'t get a dime."',
      qMotive:'"I may be a gambler, but I\'m not a liar. Not about this."'},
    {role:'Bodyguard',avatar:'🥊',motive:'silence',
      qWhere:'"Patrolling the perimeter. Outside. Alone. That\'s the job."',
      qRelation:'"I was hired to keep her safe. Look how that turned out."',
      qMotive:'"You don\'t want to accuse me of anything, detective. Trust me."'},
    {role:'Journalist',avatar:'📰',motive:'silence',
      qWhere:'"In the back booth. Working on a column. The waiters know me."',
      qRelation:'"She was a source. A good one. Told me things nobody else would."',
      qMotive:'"I write the truth, detective. I don\'t bury it in silk stockings."'},
    {role:'Mobster',avatar:'🚬',motive:'money',
      qWhere:'"Here. Having a drink. Buying the bar. That\'s what I do."',
      qRelation:'"Business. Just business. She was a good investment. Until she wasn\'t."',
      qMotive:'"You talk like that to me again, you\'ll regret it. Understood?"'},
    {role:'Doctor',avatar:'⚕️',motive:'obsession',
      qWhere:'"At my practice. Late rounds. The nurse can confirm."',
      qRelation:'"She came to me for — well. Private things. I don\'t discuss them."',
      qMotive:'"I take an oath, detective. Do you know what that means?"'},
    {role:'Ex-Lover',avatar:'❤️',motive:'obsession',
      qWhere:'"Walking. Thinking. I do that at night. Alone. No one to vouch for me."',
      qRelation:'"We were together. Once. She ended it. That was that."',
      qMotive:'"You don\'t stop loving someone just because they say stop."'}
  ],
  motiveClues: {
    money: [
      {name:'Ledger',icon:'📒',text:'A ledger hidden in {KILLER}\'s desk. {VICTIM} had been paid off for months — she was about to testify against them.',question:'"This ledger has your name on every page."',response:'"That\'s — that\'s just business. She was valuable. Of course I paid her. That doesn\'t mean I killed her."'},
      {name:'Debt Note',icon:'📝',text:'A promissory note in {KILLER}\'s handwriting. Unsigned, dated last week. {VICTIM} was demanding full payment.',question:'"You owed her money. A lot of it."',response:'"Everyone owes everyone in this town. It\'s called commerce, detective."'},
      {name:'Empty Safe',icon:'🔒',text:'The office safe is empty. {KILLER}\'s financial records are gone. Someone was covering their tracks.',question:'"Your safe is empty. Where are the records?"',response:'"I moved them. For safekeeping. That\'s not a crime."'}
    ],
    jealousy: [
      {name:'Ripped Photograph',icon:'📸',text:'A photo of {VICTIM} with another man, torn in half. Found in {KILLER}\'s coat pocket.',question:'"You tore this photo. Why?"',response:'"She was mine. She was supposed to be mine. You wouldn\'t understand."'},
      {name:'Threatening Note',icon:'✉️',text:'A note in {KILLER}\'s hand: "If I can\'t have you, no one will." Never sen
